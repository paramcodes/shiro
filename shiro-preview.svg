<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif; background: transparent;">
  <!-- App Window Frame -->
  <rect x="0" y="0" width="960" height="540" rx="8" fill="var(--surface, #ffffff)" stroke="var(--border, #e2e8f0)" stroke-width="1"/>
  
  <!-- Top Navigation Bar -->
  <line x1="0" y1="56" x2="960" y2="56" stroke="var(--border, #e2e8f0)" stroke-width="1"/>
  <text x="24" y="35" fill="var(--fg, #0f172a)" font-weight="700" font-size="16">Shiro Whiteboard</text>
  <rect x="180" y="16" width="180" height="24" rx="4" fill="var(--surface, #f8fafc)" stroke="var(--border, #e2e8f0)" stroke-width="1"/>
  <text x="192" y="33" fill="var(--muted, #64748b)" font-size="13">Sprint Planning Q4</text>
  
  <!-- Right Action Buttons -->
  <rect x="740" y="16" width="80" height="24" rx="4" fill="var(--accent, #000000)" />
  <text x="764" y="32" fill="#ffffff" font-weight="600" font-size="12">Share</text>
  
  <circle cx="850" cy="28" r="12" fill="var(--muted, #cbd5e1)" />
  <text x="846" y="32" fill="var(--fg, #0f172a)" font-weight="600" font-size="11">U1</text>

  <!-- Left Floating Toolbar -->
  <rect x="16" y="200" width="48" height="220" rx="8" fill="var(--surface, #ffffff)" stroke="var(--border, #e2e8f0)" stroke-width="1"/>
  <g fill="var(--muted, #64748b)" transform="translate(28, 215)">
    <!-- Tool icons representations -->
    <rect x="0" y="0" width="24" height="24" rx="4" fill="var(--surface, #f1f5f9)"/>
    <rect x="0" y="36" width="24" height="24" rx="4"/>
    <rect x="0" y="72" width="24" height="24" rx="4"/>
    <rect x="0" y="108" width="24" height="24" rx="4"/>
    <rect x="0" y="144" width="24" height="24" rx="4"/>
    <rect x="0" y="180" width="24" height="24" rx="4"/>
  </g>

  <!-- Canvas Content Area -->
  <g transform="translate(100, 80)">
    <!-- Grid dots pattern -->
    <pattern id="dotgrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--border, #cbd5e1)" opacity="0.6"/>
    </pattern>
    <rect x="0" y="0" width="840" height="440" fill="url(#dotgrid)" rx="4"/>

    <!-- Sticky Note 1 (Yellow) -->
    <rect x="80" y="60" width="180" height="140" rx="6" fill="#fef08a" stroke="#facc15" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="96" y="90" fill="#713f12" font-weight="700" font-size="14">Architecture Spike</text>
    <text x="96" y="115" fill="#854d0e" font-size="12">- Bun workspace</text>
    <text x="96" y="135" fill="#854d0e" font-size="12">- Better Auth + SQLite</text>
    <text x="96" y="155" fill="#854d0e" font-size="12">- tldraw canvas SDK</text>

    <!-- Sticky Note 2 (Blue) -->
    <rect x="320" y="60" width="180" height="140" rx="6" fill="#bae6fd" stroke="#38bdf8" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="336" y="90" fill="#0369a1" font-weight="700" font-size="14">Real-Time Sync</text>
    <text x="336" y="115" fill="#0369a1" font-size="12">- TLSocketRoom</text>
    <text x="336" y="135" fill="#0369a1" font-size="12">- WebSocket sync</text>
    <text x="336" y="155" fill="#0369a1" font-size="12">- Role enforcement</text>

    <!-- Connector Arrow -->
    <path d="M 260 130 L 320 130" stroke="var(--muted, #64748b)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Frame Box (Presentation) -->
    <rect x="60" y="240" width="460" height="170" rx="8" fill="none" stroke="var(--accent, #000000)" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="60" y="216" width="100" height="24" rx="4" fill="var(--accent, #000000)"/>
    <text x="72" y="232" fill="#ffffff" font-weight="600" font-size="12">Frame 1: Core</text>

    <!-- Sticky Note 3 (Green) inside frame -->
    <rect x="340" y="260" width="160" height="130" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
    <text x="356" y="290" fill="#166534" font-weight="700" font-size="14">Templates & Export</text>
    <text x="356" y="315" fill="#166534" font-size="12">- Brainstorming</text>
    <text x="356" y="335" fill="#166534" font-size="12">- Retrospective</text>
    <text x="356" y="355" fill="#166534" font-size="12">- JSON / Image Export</text>

    <!-- Collaborator Presence Cursor -->
    <g transform="translate(380, 180)">
      <polygon points="0,0 0,16 5,12 11,18 14,15 8,9 14,9" fill="#ec4899" stroke="#ffffff" stroke-width="1"/>
      <rect x="14" y="14" width="64" height="20" rx="4" fill="#ec4899"/>
      <text x="20" y="28" fill="#ffffff" font-weight="600" font-size="11">Collaborator</text>
    </g>
  </g>
</svg>
